apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-frontend
  namespace: distributed-hospital
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hospital.example.com
      secretName: hospital-frontend-tls
  rules:
    - host: hospital.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
