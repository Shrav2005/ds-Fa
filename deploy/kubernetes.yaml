---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling
  namespace: distributed-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signaling
  template:
    metadata:
      labels:
        app: signaling
    spec:
      enableServiceLinks: false
      containers:
        - name: signaling
          image: distributed-hospital-signaling:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: websocket
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: websocket
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
