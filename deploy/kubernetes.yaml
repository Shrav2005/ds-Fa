apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: distributed-hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mongodb 27017 && nc -z rabbitmq 5672; do echo waiting for MongoDB and RabbitMQ; sleep 2; done
      containers:
        - name: coordinator
          image: distributed-hospital-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - coordinator.py
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: MONGO_URI
              value: mongodb://mongodb:27017
            - name: DOCKER_ENV
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
